name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff and shellcheck (pinned)
        run: pip install ruff==0.17.3 shellcheck-py==0.11.0.1
      - name: shellcheck (bash scripts)
        run: |
          shellcheck --version
          shellcheck --version | grep -q 'version: 0.11.0'
          shellcheck --severity=warning scripts/*.sh scripts/pre-push scripts/tests/*.sh
      - name: ruff check (kit Python)
        run: ruff check tools skills scripts

  selftest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for throwaway repos
        run: |
          git config --global user.name "agent-kit-ci"
          git config --global user.email "ci@example.com"
      - name: Ensure jq (the bash guards need it)
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get install -y jq ;;
              macOS) brew install jq ;;
              Windows) choco install jq -y ;;
            esac
          fi
          jq --version
      - name: Validate skills
        run: python tools/validate_skills.py
      - name: Selftest
        run: python tools/selftest.py
      - name: Selftest with a cp1252 console
        run: python tools/selftest.py --cp1252
      - name: Guard script tests (bash)
        shell: bash
        run: bash scripts/test-kit.sh
      - name: Guard Python tests
        shell: bash  # on Windows this puts Git's bash first on PATH, not the WSL launcher
        run: python -m unittest scripts/tests/test_guard_py.py -v
